# モーションテトリス 配布ファイルの作成(hand_tetris.py を Releases ページに置く)
# 使い方: main に取り込む(Merge)と、hand_tetris.py が変わっていれば自動で作る。
#         手で作るときは GitHub の「Actions」→「配布ファイルを作る」→「Run workflow」。
# 版の名前(タグ)は v<VERSION>(hand_tetris.py の VERSION)。同じ版をもう一度作ると、ファイルを差し替える。
# exe はここでは作らない(Dr. Ishida の指示があったときだけ。CLAUDE.md「exe配布」)。
name: 配布ファイルを作る

on:
  workflow_dispatch:
  push:   # 取り込み(Merge)でプログラムが変わったら自動で作る(作り忘れを防ぐ)
    branches: [main]
    paths:
      - hand_tetris.py

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: ライブラリを入れる
        run: python -m pip install opencv-python-headless mediapipe numpy pygame pillow

      - name: 構文確認と自動テスト
        env:
          SDL_AUDIODRIVER: dummy
        run: |
          python -m py_compile hand_tetris.py
          python -m unittest discover tests -v

      - name: Releases ページに置く
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep -oP '^VERSION = "\K[0-9.]+' hand_tetris.py | head -1)
          TAG="v${V}"
          TITLE="モーションテトリス Ver ${V}"
          mkdir -p dist
          cp hand_tetris.py dist/hand_tetris.py
          NOTE=$(awk '/^## /{n++} n==1' CHANGELOG.md)
          cat > dist/notes.md <<EOF2
          ## モーションテトリス 配布ファイル

          | ファイル | 内容 |
          |---|---|
          | \`hand_tetris.py\` | Ver ${V}。Python を入れた Windows の PC でダブルクリックして起動 |

          - 初回は、足りないライブラリとモデルファイルを自動で用意します(インターネット接続が必要・数分)。
          - ダウンロードフォルダに古い hand_tetris.py があると「hand_tetris (1).py」になります。古いほうは削除してください。
          - 作成日時: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')(日本時間)
          - 元にした変更: ${GITHUB_SHA:0:7}

          ${NOTE}
          EOF2
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/hand_tetris.py --clobber
            gh release edit "$TAG" --notes-file dist/notes.md --latest
          else
            gh release create "$TAG" dist/hand_tetris.py --target "$GITHUB_SHA" --title "$TITLE" \
              --notes-file dist/notes.md --latest
          fi
# END OF FILE
